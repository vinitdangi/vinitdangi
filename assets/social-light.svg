<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title desc"><title id="title">GitHub profile contact card</title><desc id="desc">A GitHub profile link card in the original teal and green terminal style.</desc><defs><linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087f72"/><stop offset="1" stop-color="#278448"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#cce4d7" stroke-width="1" opacity=".42"/></pattern><clipPath id="avatar"><circle cx="142" cy="137" r="65"/></clipPath></defs><rect x="1" y="1" width="958" height="218" rx="20" fill="#f3fbf7" stroke="#a7cdb9" stroke-width="2"/><rect x="2" y="2" width="956" height="216" rx="19" fill="url(#grid)" opacity=".55"/><text x="30" y="48" fill="#54766c" font-family="monospace" font-size="12" letter-spacing="3">THE NEXT SCENE</text><text x="30" y="105" fill="#123b34" font-family="sans-serif" font-size="27" font-weight="700">Building for the cloud.</text><text x="30" y="141" fill="#123b34" font-family="sans-serif" font-size="27" font-weight="700">Securing what runs on it.</text><text x="30" y="181" fill="#54766c" font-family="sans-serif" font-size="15">Cloud infrastructure · web applications · networking · identity · automation</text><a href="https://github.com/vinitdangi"><rect x="700" y="82" width="220" height="68" rx="13" fill="#e8f5ee" stroke="#087f72" stroke-width="2"/><text x="810" y="108" text-anchor="middle" fill="#087f72" font-family="monospace" font-size="11">CONNECT / PROFILE</text><text x="810" y="132" text-anchor="middle" fill="#123b34" font-family="sans-serif" font-weight="700" font-size="18">GitHub ↗</text></a></svg>